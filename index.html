
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Meek's Retribution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        color: #00ff41;
        font-family: 'VT323', monospace;
        overflow-x: hidden;
      }
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 100;
      }
      .flicker {
        animation: flicker 0.15s infinite;
      }
      @keyframes flicker {
        0% { opacity: 0.9; }
        10% { opacity: 0.8; }
        20% { opacity: 0.9; }
        30% { opacity: 1; }
        40% { opacity: 0.7; }
        50% { opacity: 0.85; }
        60% { opacity: 1; }
        70% { opacity: 0.9; }
        80% { opacity: 0.8; }
        90% { opacity: 0.95; }
        100% { opacity: 1; }
      }
      .scanline {
        width: 100%;
        height: 100px;
        z-index: 99;
        background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 10s linear infinite;
      }
      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }
      .horror-title {
        font-family: 'Creepster', cursive;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
      }
      .blood-text {
        font-family: 'Special Elite', cursive;
        color: #b91c1c;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>
  </body>
</html>
